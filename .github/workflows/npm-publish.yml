# Publish to npm when a GitHub release is created.
# Auth: npm Trusted Publishing (OIDC) by default, or secrets.NPM_TOKEN as fallback.
# Trusted Publisher on npmjs.com: user DINHDUY, repo kb-genie, workflow npm-publish.yml
# https://docs.npmjs.com/trusted-publishers/

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            # setup-node writes an empty _authToken that blocks OIDC
            if [ -f .npmrc ]; then
              sed -i '/_authToken=/d' .npmrc
            fi
          fi
          npm publish --access public
