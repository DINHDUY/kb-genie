      <stop offset="100%" stop-color="#EEF2F6"/>
    </radialGradient>
    <linearGradient id="coreHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D4A"/>
